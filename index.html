<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacWallpaper — MacBook 刘海壁纸制作工具</title>
<style>
  /* ========== 基础样式 ========== */
  :root {
    --bg: #141419;
    --panel: #1e1e26;
    --panel-border: #2e2e3a;
    --text: #e8e8ee;
    --text-dim: #8a8a99;
    --accent: #4f8cff;
    --accent-hover: #6b9eff;
    --danger: #ff6b6b;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }

  /* ========== 布局 ========== */
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--panel-border);
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header p { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  main {
    display: flex;
    gap: 24px;
    padding: 24px 28px;
    align-items: flex-start;
  }
  .panel {
    width: 320px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .preview-area { flex: 1; min-width: 0; position: relative; }

  @media (max-width: 860px) {
    main { flex-direction: column; }
    .panel { width: 100%; }
  }

  /* ========== 控件区块 ========== */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  /* 机型选择 */
  .model-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .model-option {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 10px 12px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    transition: border-color 0.15s, background 0.15s;
  }
  .model-option:hover { border-color: var(--accent); }
  .model-option.active {
    border-color: var(--accent);
    background: rgba(79, 140, 255, 0.12);
  }
  .model-option .name { font-size: 13px; font-weight: 600; }
  .model-option .res { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .model-meta {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.8;
    margin-top: 10px;
    padding: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
  }

  /* 上传区 */
  .dropzone {
    background: var(--panel);
    border: 2px dashed var(--panel-border);
    border-radius: var(--radius);
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
    background: rgba(79, 140, 255, 0.06);
  }
  .dropzone .hint { font-size: 14px; }
  .dropzone .sub { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
  .dropzone .error { font-size: 12px; color: var(--danger); margin-top: 8px; min-height: 14px; }
  .file-info { font-size: 12px; color: var(--text-dim); margin-top: 8px; word-break: break-all; }

  /* 参数控件 */
  .zoom-row { display: flex; align-items: center; gap: 8px; }
  .zoom-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .zoom-value { font-size: 12px; color: var(--text-dim); width: 42px; text-align: right; }
  .mini-btn {
    flex-shrink: 0;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--accent);
    background: rgba(79, 140, 255, 0.12);
    border: 1px solid var(--accent);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .mini-btn:hover { background: rgba(79, 140, 255, 0.25); }

  .anchor-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    max-width: 168px;
  }
  .anchor-btn {
    height: 32px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, background 0.15s;
  }
  .anchor-btn:hover { border-color: var(--accent); }
  .anchor-btn.active {
    border-color: var(--accent);
    background: rgba(79, 140, 255, 0.12);
  }
  .anchor-btn .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
  }
  .anchor-btn.active .dot { background: var(--accent); }
  .anchor-hint { font-size: 12px; color: var(--text-dim); margin-top: 8px; }

  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .slider-value { font-size: 12px; color: var(--text-dim); width: 48px; text-align: right; }

  .check-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
  }
  .check-row input { accent-color: var(--accent); }

  /* 下载按钮 */
  .download-btn {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  .download-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .download-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .format-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 13px; }
  .format-row .format-label { color: var(--text-dim); }
  .format-option {
    padding: 4px 12px;
    font-size: 12px;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .format-option:hover { border-color: var(--accent); }
  .format-option.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(79, 140, 255, 0.12);
  }
  .output-info { font-size: 12px; color: var(--text-dim); text-align: center; margin-top: 8px; }

  /* ========== 预览 ========== */
  .preview-frame {
    position: relative;
    background: #0a0a0d;
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  #previewCanvas, #originalImg {
    max-width: 100%;
    height: auto;
    border-radius: 4px;
    display: block;
  }
  /* 成品预览画布：按住拖动调整位置 */
  #previewCanvas { cursor: grab; touch-action: none; }
  #previewCanvas.dragging { cursor: grabbing; }
  .placeholder {
    color: var(--text-dim);
    font-size: 14px;
    padding: 120px 40px;
    text-align: center;
    line-height: 2;
  }
  .preview-tip { font-size: 12px; color: var(--text-dim); margin-top: 10px; text-align: center; }

  /* 原图预览确认栏 */
  .confirm-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .confirm-info { font-size: 13px; color: var(--text-dim); }
  .confirm-actions { display: flex; gap: 10px; }
  .ghost-btn {
    padding: 10px 16px;
    font-size: 14px;
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .ghost-btn:hover { border-color: var(--accent); }
  .step-btn { width: auto; padding: 10px 18px; font-size: 14px; }

  /* ========== 加载指示（本地解码/合成无法精确度量进度，用滑动条示意） ========== */
  .loading-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: rgba(10, 10, 13, 0.78);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .loading-text { font-size: 13px; color: var(--text-dim); }
  .loading-bar {
    width: 180px;
    height: 4px;
    background: var(--panel-border);
    border-radius: 2px;
    overflow: hidden;
  }
  .loading-bar::before {
    content: '';
    display: block;
    width: 40%;
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    animation: load-slide 1.1s ease-in-out infinite;
  }
  @keyframes load-slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(280%); }
  }
</style>
</head>
<body>
<header>
  <h1>MacWallpaper</h1>
  <p>上传壁纸 → 顶部刘海区域涂黑 → 壁纸整体下移，让 MacBook 刘海"消失"在壁纸里</p>
</header>

<main>
  <!-- 左侧控制面板 -->
  <aside class="panel">
    <div>
      <div class="section-title">机型</div>
      <div class="model-grid" id="modelGrid"></div>
      <div class="model-meta" id="modelMeta"></div>
    </div>

    <div>
      <div class="section-title">上传壁纸</div>
      <div class="dropzone" id="dropzone">
        <div class="hint">点击选择或拖拽图片到此处</div>
        <div class="sub">支持 JPG / PNG / WebP 等常见格式</div>
        <div class="error" id="uploadError"></div>
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <div class="file-info" id="fileInfo"></div>
    </div>

    <div>
      <div class="section-title">缩放与位置</div>
      <div class="zoom-row">
        <input type="range" id="zoomSlider" min="100" max="300" step="1" value="100">
        <span class="zoom-value" id="zoomValue">100%</span>
        <button type="button" class="mini-btn" id="fillZoneBtn" title="放大到刚好铺满黑条以下区域，消除黑边">填充</button>
      </div>
      <div class="anchor-grid" id="anchorGrid">
        <button type="button" class="anchor-btn" data-anchor="left-top" title="吸附：左上"><span class="dot"></span></button>
        <button type="button" class="anchor-btn" data-anchor="center-top" title="吸附：上边居中"><span class="dot"></span></button>
        <button type="button" class="anchor-btn" data-anchor="right-top" title="吸附：右上"><span class="dot"></span></button>
        <button type="button" class="anchor-btn" data-anchor="left-center" title="吸附：左边居中"><span class="dot"></span></button>
        <button type="button" class="anchor-btn active" data-anchor="center-center" title="吸附：正中心"><span class="dot"></span></button>
        <button type="button" class="anchor-btn" data-anchor="right-center" title="吸附：右边居中"><span class="dot"></span></button>
        <button type="button" class="anchor-btn" data-anchor="left-bottom" title="吸附：左下"><span class="dot"></span></button>
        <button type="button" class="anchor-btn" data-anchor="center-bottom" title="吸附：下边居中"><span class="dot"></span></button>
        <button type="button" class="anchor-btn" data-anchor="right-bottom" title="吸附：右下"><span class="dot"></span></button>
      </div>
      <div class="anchor-hint">缩放不足会出现黑边，点「填充」可刚好铺满；九宫格控制画面吸附位置</div>
    </div>

    <div>
      <div class="section-title">顶部黑条高度</div>
      <div class="slider-row">
        <input type="range" id="stripHeight" min="0" max="300" step="1">
        <span class="slider-value" id="stripValue"></span>
      </div>
    </div>

    <label class="check-row">
      <input type="checkbox" id="showNotch" checked>
      <span>预览中显示刘海轮廓（不影响导出）</span>
    </label>

    <div>
      <div class="format-row">
        <span class="format-label">导出格式</span>
        <button type="button" class="format-option active" data-format="png" title="无损，文件较大">PNG</button>
        <button type="button" class="format-option" data-format="jpg" title="高质量有损压缩，文件小，适合照片类壁纸">JPG</button>
      </div>
      <button class="download-btn" id="downloadBtn" disabled>下载壁纸 PNG</button>
      <div class="output-info" id="outputInfo"></div>
    </div>
  </aside>

  <!-- 右侧预览区 -->
  <section class="preview-area">
    <!-- 加载指示：导入解码 / 生成合成 / 导出编码期间显示 -->
    <div class="loading-overlay" id="loadingOverlay" hidden>
      <div class="loading-bar"></div>
      <div class="loading-text" id="loadingText"></div>
    </div>

    <!-- 空状态 -->
    <div class="preview-frame" id="emptyView">
      <div class="placeholder">
        还没有上传壁纸<br>选择机型并上传一张图片，先预览原图，再生成成品
      </div>
    </div>

    <!-- 第一步：原图预览确认 -->
    <div id="confirmView" hidden>
      <div class="preview-frame">
        <img id="originalImg" alt="原图预览">
      </div>
      <div class="confirm-bar">
        <span class="confirm-info" id="confirmInfo"></span>
        <div class="confirm-actions">
          <button type="button" class="ghost-btn" id="reselectBtn">重新选择</button>
          <button type="button" class="download-btn step-btn" id="confirmBtn">确认图片，生成壁纸</button>
        </div>
      </div>
    </div>

    <!-- 第二步：成品效果预览 -->
    <div id="editView" hidden>
      <div class="preview-frame">
        <canvas id="previewCanvas"></canvas>
      </div>
      <div class="preview-tip">按住拖动可调整画面位置，导出结果与预览一致；白色虚线框为刘海位置示意（不导出）</div>
    </div>
  </section>
</main>

<script>
/* ========== 常量：机型数据 ========== */
/* strip: 默认黑条高度 = 屏幕原生高度 − 16:10 区域高度，即苹果为刘海+菜单栏增加的顶部区域，与各机型自身结构精确匹配
   barPt: 该机型菜单栏高度的 pt 值（Pro 为 37pt@2x；Air 缩放系数非整数，15" 为 38pt）
   notchW / notchH: 刘海实测尺寸（14" = 185×32 pt，16" = 220×38 pt），仅用于预览轮廓示意 */
const MODELS = [
  { id: 'macbook-pro-14', name: 'MacBook Pro 14"', width: 3024, height: 1964, strip: 74, barPt: '37', notchPt: '185 × 32 pt', notchW: 370, notchH: 64 },
  { id: 'macbook-pro-16', name: 'MacBook Pro 16"', width: 3456, height: 2234, strip: 74, barPt: '37', notchPt: '220 × 38 pt', notchW: 440, notchH: 76 },
  { id: 'macbook-air-13', name: 'MacBook Air 13"', width: 2560, height: 1664, strip: 64, barPt: '≈ 37', notchPt: '≈ 12% 屏宽', notchW: 310, notchH: 56 },
  { id: 'macbook-air-15', name: 'MacBook Air 15"', width: 2880, height: 1864, strip: 64, barPt: '38', notchPt: '≈ 12% 屏宽', notchW: 346, notchH: 54 },
];

/* ========== 状态 ========== */
let currentModel = MODELS[0];
let sourceImage = null;       // 当前上传的 Image 对象
let sourceObjectUrl = null;   // 待释放的 ObjectURL
let currentStep = 'empty';    // empty / confirm / edit
let zoomPercent = 100;        // 缩放百分比（100 = 按宽度铺满）
let anchor = 'center-center'; // 吸附位置：left|center|right 与 top|center|bottom 组合
let panX = 0;                 // 拖动平移偏移（导出画布像素）
let panY = 0;
let exportFormat = 'png';     // 导出格式：png / jpg
let sourceFileBaseName = 'wallpaper'; // 原文件名（去扩展名），用于导出命名
const JPG_QUALITY = 0.92;     // JPG 导出质量（黑条区纯黑，高质量下几乎无可见压缩痕迹）

/* 清理文件名中的非法字符（Windows/macOS 路径限制），空结果时给兜底值 */
function sanitizeFileName(name, fallback) {
  const cleaned = name.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').trim();
  return cleaned || fallback;
}

/* ========== DOM 引用 ========== */
const modelGrid = document.getElementById('modelGrid');
const modelMeta = document.getElementById('modelMeta');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const uploadError = document.getElementById('uploadError');
const fileInfo = document.getElementById('fileInfo');
const stripSlider = document.getElementById('stripHeight');
const stripValue = document.getElementById('stripValue');
const zoomSlider = document.getElementById('zoomSlider');
const zoomValue = document.getElementById('zoomValue');
const fillZoneBtn = document.getElementById('fillZoneBtn');
const anchorGrid = document.getElementById('anchorGrid');
const showNotchCheckbox = document.getElementById('showNotch');
const downloadBtn = document.getElementById('downloadBtn');
const outputInfo = document.getElementById('outputInfo');
const previewCanvas = document.getElementById('previewCanvas');
const emptyView = document.getElementById('emptyView');
const confirmView = document.getElementById('confirmView');
const editView = document.getElementById('editView');
const originalImg = document.getElementById('originalImg');
const confirmInfo = document.getElementById('confirmInfo');
const confirmBtn = document.getElementById('confirmBtn');
const reselectBtn = document.getElementById('reselectBtn');
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingText = document.getElementById('loadingText');

/* 离屏画布：承载最终导出内容（不含预览标记） */
const exportCanvas = document.createElement('canvas');
const exportCtx = exportCanvas.getContext('2d');
const previewCtx = previewCanvas.getContext('2d');

/* ========== 渲染 ========== */
function render() {
  if (!sourceImage) return;
  const { width, height } = currentModel;
  const stripHeight = Number(stripSlider.value);

  exportCanvas.width = width;
  exportCanvas.height = height;

  // 整体填充黑色（黑条及缩放不足时的留白）
  exportCtx.fillStyle = '#000';
  exportCtx.fillRect(0, 0, width, height);

  // 图片绘制尺寸：以「按宽度铺满」为 100% 基准，按缩放百分比放大
  const baseWidth = width;
  const baseHeight = sourceImage.height * (width / sourceImage.width);
  const drawWidth = baseWidth * (zoomPercent / 100);
  const drawHeight = baseHeight * (zoomPercent / 100);

  // 按吸附位置计算绘制坐标（top 吸附到黑条下沿），叠加拖动平移偏移
  const availHeight = height - stripHeight;
  const [alignX, alignY] = anchor.split('-');
  let drawX, drawY;
  if (alignX === 'left') drawX = 0;
  else if (alignX === 'right') drawX = width - drawWidth;
  else drawX = (width - drawWidth) / 2;
  if (alignY === 'top') drawY = stripHeight;
  else if (alignY === 'bottom') drawY = height - drawHeight;
  else drawY = stripHeight + (availHeight - drawHeight) / 2;
  drawX += panX;
  drawY += panY;

  // 约束位置：横向铺满、纵向不露出顶部黑条与底部黑边
  drawX = clampRange(drawX, width - drawWidth, 0);
  drawY = clampRange(drawY, height - drawHeight, stripHeight);
  panX = drawX - (alignX === 'left' ? 0 : alignX === 'right' ? width - drawWidth : (width - drawWidth) / 2);
  panY = drawY - (alignY === 'top' ? stripHeight : alignY === 'bottom' ? height - drawHeight : stripHeight + (availHeight - drawHeight) / 2);

  exportCtx.drawImage(sourceImage, drawX, drawY, drawWidth, drawHeight);

  updatePreview();
}

/* 将值约束在 [lo, hi] 内（自动处理上下界大小颠倒的情况） */
function clampRange(value, a, b) {
  const lo = Math.min(a, b);
  const hi = Math.max(a, b);
  return Math.min(Math.max(value, lo), hi);
}

/* 计算刚好铺满黑条以下区域、不产生黑边所需的最小缩放百分比 */
function getFillZoom() {
  if (!sourceImage) return 100;
  const availHeight = currentModel.height - Number(stripSlider.value);
  const baseHeight = sourceImage.height * (currentModel.width / sourceImage.width);
  return Math.ceil((availHeight / baseHeight) * 100);
}

/* ========== 视图切换 ========== */
/* step: empty（未上传）/ confirm（原图预览确认）/ edit（成品预览与导出） */
function showStep(step) {
  currentStep = step;
  emptyView.hidden = step !== 'empty';
  confirmView.hidden = step !== 'confirm';
  editView.hidden = step !== 'edit';
}

function updatePreview() {
  previewCanvas.width = exportCanvas.width;
  previewCanvas.height = exportCanvas.height;
  previewCtx.drawImage(exportCanvas, 0, 0);

  // 刘海轮廓示意（仅预览，不参与导出，尺寸为实测值）
  if (showNotchCheckbox.checked) {
    const notchWidth = currentModel.notchW;
    const notchHeight = currentModel.notchH;
    const x = (previewCanvas.width - notchWidth) / 2;
    const radius = Math.min(notchHeight * 0.5, 24);
    previewCtx.save();
    previewCtx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
    previewCtx.lineWidth = Math.max(2, previewCanvas.width / 1200);
    previewCtx.setLineDash([previewCtx.lineWidth * 4, previewCtx.lineWidth * 3]);
    previewCtx.beginPath();
    previewCtx.moveTo(x, 0);
    previewCtx.lineTo(x, notchHeight - radius);
    previewCtx.arcTo(x, notchHeight, x + radius, notchHeight, radius);
    previewCtx.lineTo(x + notchWidth - radius, notchHeight);
    previewCtx.arcTo(x + notchWidth, notchHeight, x + notchWidth, notchHeight - radius, radius);
    previewCtx.lineTo(x + notchWidth, 0);
    previewCtx.stroke();
    previewCtx.restore();
  }
}

/* ========== 机型选择 ========== */
function buildModelGrid() {
  MODELS.forEach((model, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'model-option' + (index === 0 ? ' active' : '');
    button.innerHTML = `<div class="name">${model.name}</div><div class="res">${model.width} × ${model.height}</div>`;
    button.addEventListener('click', () => selectModel(model, button));
    modelGrid.appendChild(button);
  });
}

function selectModel(model, button) {
  currentModel = model;
  document.querySelectorAll('.model-option').forEach(el => el.classList.remove('active'));
  button.classList.add('active');
  stripSlider.value = model.strip;
  stripValue.textContent = `${model.strip} px`;
  zoomPercent = 100;
  zoomSlider.value = 100;
  zoomValue.textContent = '100%';
  panX = 0;
  panY = 0;
  updateModelMeta();
  render();
  if (currentStep === 'edit') updateOutputInfo();
}

/* 左侧栏展示当前机型的刘海实测尺寸与黑条默认高度（均按机型自身结构独立推导） */
function updateModelMeta() {
  modelMeta.innerHTML =
    `刘海尺寸：<strong>${currentModel.notchPt}</strong>` +
    `（约 ${currentModel.notchW} × ${currentModel.notchH} px）<br>` +
    `菜单栏/黑条默认高度：<strong>${currentModel.strip} px</strong>` +
    `（${currentModel.barPt} pt，${currentModel.height} − ${currentModel.height - currentModel.strip} = ${currentModel.strip}）<br>` +
    `按本机型的屏高 − 16:10 区域独立推导；不同机型数值相同属正常现象`;
}

/* ========== 加载指示 ========== */
function showLoading(text) {
  loadingText.textContent = text;
  loadingOverlay.hidden = false;
}
function hideLoading() {
  loadingOverlay.hidden = true;
}

/* ========== 图片上传 ========== */
/* skipConfirm：拖拽上传时跳过原图确认步骤，直接进入成品预览 */
function handleFile(file, skipConfirm = false) {
  uploadError.textContent = '';
  if (!file || !file.type.startsWith('image/')) {
    uploadError.textContent = '请选择图片文件';
    return;
  }
  if (sourceObjectUrl) URL.revokeObjectURL(sourceObjectUrl);
  sourceObjectUrl = URL.createObjectURL(file);

  showLoading('正在加载图片…');
  const image = new Image();
  image.onload = () => {
    hideLoading();
    sourceImage = image;
    // 记录原文件名（去扩展名），导出时命名为「原文件名-机型名」
    sourceFileBaseName = sanitizeFileName(file.name.replace(/\.[^.]+$/, ''), 'wallpaper');
    fileInfo.textContent = `${file.name} · ${image.width} × ${image.height}`;
    // 新图片重置缩放与平移，避免沿用上一张的状态
    zoomPercent = 100;
    zoomSlider.value = 100;
    zoomValue.textContent = '100%';
    panX = 0;
    panY = 0;
    if (skipConfirm) {
      // 拖拽上传：跳过确认，直接生成成品预览
      showStep('edit');
      render();
      downloadBtn.disabled = false;
      updateOutputInfo();
      return;
    }
    // 第一步：先展示原图预览，确认后才生成成品
    originalImg.src = sourceObjectUrl;
    confirmInfo.textContent = `${file.name} · ${image.width} × ${image.height}`;
    showStep('confirm');
    downloadBtn.disabled = true;
    outputInfo.textContent = '';
  };
  image.onerror = () => {
    hideLoading();
    uploadError.textContent = '图片加载失败，请更换文件';
    URL.revokeObjectURL(sourceObjectUrl);
    sourceObjectUrl = null;
  };
  image.src = sourceObjectUrl;
}

/* ========== 下载 ========== */
let exporting = false;
function downloadImage() {
  if (!sourceImage || exporting) return;
  exporting = true;
  const isJpg = exportFormat === 'jpg';
  downloadBtn.disabled = true;
  downloadBtn.textContent = '正在导出…';
  showLoading(isJpg ? '正在导出 JPG…' : '正在导出 PNG…');
  exportCanvas.toBlob((blob) => {
    exporting = false;
    downloadBtn.disabled = false;
    downloadBtn.textContent = `下载壁纸 ${exportFormat.toUpperCase()}`;
    hideLoading();
    if (!blob) {
      uploadError.textContent = '导出失败，请重试';
      return;
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    // 命名格式：原文件名-机型名（机型名去掉引号等非法字符）
    const modelName = sanitizeFileName(currentModel.name, currentModel.id);
    link.download = `${sourceFileBaseName}-${modelName}.${exportFormat}`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, isJpg ? 'image/jpeg' : 'image/png', JPG_QUALITY);
}

function updateOutputInfo() {
  outputInfo.textContent = sourceImage
    ? `输出分辨率：${currentModel.width} × ${currentModel.height}`
    : '';
}

/* ========== 事件绑定 ========== */
dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  handleFile(fileInput.files[0]);
  fileInput.value = '';
});

confirmBtn.addEventListener('click', () => {
  if (!sourceImage) return;
  showStep('edit');
  // 先画出加载指示再执行同步合成，避免大画布合成阻塞导致遮罩来不及显示
  showLoading('正在生成壁纸…');
  setTimeout(() => {
    render();
    hideLoading();
    downloadBtn.disabled = false;
    updateOutputInfo();
  }, 30);
});
reselectBtn.addEventListener('click', () => fileInput.click());

['dragenter', 'dragover'].forEach(eventName => {
  dropzone.addEventListener(eventName, (event) => {
    event.preventDefault();
    dropzone.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(eventName => {
  dropzone.addEventListener(eventName, (event) => {
    event.preventDefault();
    dropzone.classList.remove('dragover');
  });
});
dropzone.addEventListener('drop', (event) => {
  handleFile(event.dataTransfer.files[0], true);
});

stripSlider.addEventListener('input', () => {
  stripValue.textContent = `${stripSlider.value} px`;
  render();
});

/* 预览画布拖动平移：按预览/导出的缩放比换算成导出像素偏移 */
let dragging = false;
let dragLastX = 0;
let dragLastY = 0;
let dragRenderPending = false;
previewCanvas.addEventListener('pointerdown', (event) => {
  if (!sourceImage || currentStep !== 'edit') return;
  dragging = true;
  dragLastX = event.clientX;
  dragLastY = event.clientY;
  previewCanvas.classList.add('dragging');
  try { previewCanvas.setPointerCapture(event.pointerId); } catch (e) { /* 合成事件无有效指针时忽略 */ }
});
previewCanvas.addEventListener('pointermove', (event) => {
  if (!dragging) return;
  const rect = previewCanvas.getBoundingClientRect();
  const scale = previewCanvas.width / rect.width;
  panX += (event.clientX - dragLastX) * scale;
  panY += (event.clientY - dragLastY) * scale;
  dragLastX = event.clientX;
  dragLastY = event.clientY;
  // 全分辨率合成较重，用 rAF 节流到每帧最多一次
  if (!dragRenderPending) {
    dragRenderPending = true;
    requestAnimationFrame(() => {
      dragRenderPending = false;
      render();
    });
  }
});
const stopDrag = () => {
  dragging = false;
  previewCanvas.classList.remove('dragging');
};
previewCanvas.addEventListener('pointerup', stopDrag);
previewCanvas.addEventListener('pointercancel', stopDrag);
zoomSlider.addEventListener('input', () => {
  zoomPercent = Number(zoomSlider.value);
  zoomValue.textContent = `${zoomPercent}%`;
  render();
});
fillZoneBtn.addEventListener('click', () => {
  const fillZoom = Math.min(Number(zoomSlider.max), getFillZoom());
  zoomPercent = fillZoom;
  zoomSlider.value = fillZoom;
  zoomValue.textContent = `${fillZoom}%`;
  panX = 0;
  panY = 0;
  render();
});
anchorGrid.querySelectorAll('.anchor-btn').forEach(button => {
  button.addEventListener('click', () => {
    if (anchor === button.dataset.anchor) return;
    anchor = button.dataset.anchor;
    anchorGrid.querySelectorAll('.anchor-btn').forEach(el => el.classList.remove('active'));
    button.classList.add('active');
    panX = 0;
    panY = 0;
    render();
  });
});
showNotchCheckbox.addEventListener('change', updatePreview);
downloadBtn.addEventListener('click', downloadImage);

/* 导出格式切换：同步更新下载按钮文案 */
document.querySelectorAll('.format-option').forEach(button => {
  button.addEventListener('click', () => {
    exportFormat = button.dataset.format;
    document.querySelectorAll('.format-option').forEach(el => el.classList.remove('active'));
    button.classList.add('active');
    downloadBtn.textContent = `下载壁纸 ${exportFormat.toUpperCase()}`;
  });
});

/* ========== 初始化 ========== */
buildModelGrid();
updateModelMeta();
stripSlider.value = currentModel.strip;
stripValue.textContent = `${currentModel.strip} px`;
</script>
</body>
</html>
